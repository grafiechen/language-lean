# 前端与 API 共用浏览器入口，让 Session Cookie 和 CSRF 保持同源。
# TLS 可由上游反向代理终止；仅接受明确的 http/https 协议值。
map $http_x_forwarded_proto $api_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # 与后端 10 MB 文件、11 MB 请求上限一致，允许 CSV 和备份导入。
    client_max_body_size 11m;

    # 缓存版本由 worker 控制；缺失的脚本不能返回应用 HTML。
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { try_files $uri =404; }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $api_forwarded_proto;
    }

    # 刷新 Vue 路由时仍返回应用入口。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
