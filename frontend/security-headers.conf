# 与 Cloudflare public/_headers 保持相同策略。Ionic 内联样式和本地 Blob 音频不受此策略影响。
# Nginx 子 location 有自己的 add_header 时不会继承，因此必须再次 include。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
