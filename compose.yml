services:
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: language_lean
      POSTGRES_USER: language_lean
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U language_lean -d language_lean"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Database has no host port; backend accesses it via the Compose network.
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/language_lean
      DB_USER: language_lean
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
