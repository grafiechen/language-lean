services:
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      - api
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: language_lean
      POSTGRES_USER: language_lean
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U language_lean -d language_lean"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Database has no host port; backend accesses it via the Compose network.
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/language_lean
      DB_USER: language_lean
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SSL: ${MAIL_SSL:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      PASSWORD_TRANSPORT_MASTER_KEY: ${PASSWORD_TRANSPORT_MASTER_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      FSRS_DESIRED_RETENTION: ${FSRS_DESIRED_RETENTION:-0.9}
      FSRS_MAXIMUM_INTERVAL_DAYS: ${FSRS_MAXIMUM_INTERVAL_DAYS:-36500}
      REVIEW_FUTURE_CLOCK_TOLERANCE_SECONDS: ${REVIEW_FUTURE_CLOCK_TOLERANCE_SECONDS:-300}
      GOOGLE_TTS_ENABLED: ${GOOGLE_TTS_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_AUDIO_BUCKET: ${R2_AUDIO_BUCKET:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
