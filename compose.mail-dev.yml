# 本地收件箱只接收测试邮件，不向外投递；UI 仅绑定本机，SMTP 仅供容器内部访问。
# 生产模式：docker compose -f compose.yml -f compose.mail-dev.yml up -d
# 热更新：docker compose -f compose.dev.yml -f compose.mail-dev.yml up -d
services:
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:${MAILBOX_PORT:-8027}:8025"
  api:
    environment:
      MAIL_ENABLED: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: no-reply@language-lean.test
      MAIL_STARTTLS: "false"
      MAIL_SSL: "false"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5174}
    depends_on:
      mailpit:
        condition: service_started
