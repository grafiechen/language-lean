spring:
  application:
    name: language-lean-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/language_lean}
    username: ${DB_USER:language_lean}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  backup:
    enabled: ${BACKUP_ENABLED:false}
    interval-hours: ${BACKUP_INTERVAL_HOURS:0}
    retention-days: ${BACKUP_RETENTION_DAYS:0}
    timeout-seconds: ${BACKUP_TIMEOUT_SECONDS:1800}
    encryption-key: ${BACKUP_ENCRYPTION_KEY:}
    key-id: ${BACKUP_KEY_ID:}
    directory: ${BACKUP_WORK_DIRECTORY:/tmp/language-lean-backups}
    r2-account-id: ${R2_BACKUP_ACCOUNT_ID:}
    r2-access-key-id: ${R2_BACKUP_ACCESS_KEY_ID:}
    r2-secret-access-key: ${R2_BACKUP_SECRET_ACCESS_KEY:}
    r2-bucket: ${R2_BACKUP_BUCKET:}
  password-transport:
    master-key: ${PASSWORD_TRANSPORT_MASTER_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    starttls: ${MAIL_STARTTLS:true}
    ssl: ${MAIL_SSL:false}
    public-url: ${PUBLIC_APP_URL:}
  audio:
    google-enabled: ${GOOGLE_TTS_ENABLED:false}
    r2-account-id: ${R2_ACCOUNT_ID:}
    r2-access-key-id: ${R2_ACCESS_KEY_ID:}
    r2-secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    r2-bucket: ${R2_AUDIO_BUCKET:}
  fsrs:
    desired-retention: ${FSRS_DESIRED_RETENTION:0.9}
    maximum-interval-days: ${FSRS_MAXIMUM_INTERVAL_DAYS:36500}
    future-clock-tolerance-seconds: ${REVIEW_FUTURE_CLOCK_TOLERANCE_SECONDS:300}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
