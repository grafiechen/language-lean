spring:
  application:
    name: language-lean-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/language_lean}
    username: ${DB_USER:language_lean}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
