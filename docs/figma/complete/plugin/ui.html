<!doctype html><html lang="zh"><meta charset="utf-8"><style>body{font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;padding:20px;color:#183b36}button{padding:10px 16px;background:#286557;color:white;border:0;border-radius:8px;cursor:pointer}#download{display:none;background:#f1f5ef;color:#286557}p{white-space:pre-wrap}small{color:#64736a}</style><h2>生成第一版完整设计</h2><p>111 个页面及状态，桌面端和移动端各一套。使用原生文字、组件、主题变量和自动布局。</p><small>只使用虚构样例。不会上传文件、读取账号或覆盖已有设计。需使用 Figma 桌面端并启用微软雅黑字体。</small><p><button id="start">生成全部页面</button> <button id="download">保存生成报告</button></p><p id="status">生成后仍需检查 Figma 实际视觉效果，再另存为 .fig。</p><script>let report;document.getElementById('start').onclick=()=>{document.getElementById('start').disabled=true;parent.postMessage({pluginMessage:{type:'generate'}},'*')};window.onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;const status=document.getElementById('status');if(m.type==='progress')status.textContent=m.done+' / '+m.total+' 画板 · '+m.screen;if(m.type==='done'){report=m.report;status.textContent='已生成 '+report.frameCount+' 个画板、'+report.componentCount+' 个基础组件。字体：'+report.font+'。\n原生结构检查通过；实际视觉验收待完成。';document.getElementById('download').style.display='inline-block'}if(m.type==='error'){status.textContent=m.message;document.getElementById('start').disabled=false}};document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='figma-generation-report.json';a.click();URL.revokeObjectURL(a.href)};</script></html>
