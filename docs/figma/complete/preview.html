function render(s){let n;

 if(s.kind==='entry'){n=el(s.target?'a':'div','node entry '+(s.selected?'selected':''));if(s.target)n.href='#'+s.target;n.append(txt(s.title,'h3'),txt(s.subtitle,'small'));return n}
 if(s.kind==='field'){n=el('div','node field');n.append(txt(s.label,'label'),el('div','value '+s.mode,s.value||' '));if(s.note)n.append(txt(s.note,'small'));return n}
 if(s.kind==='check'){n=el('div','node check');n.append(el('div','checkbox '+(s.checked?'checked':'')),txt(s.text,'label'));return n}
 if(s.kind==='table'){n=el('table','node table');for(const [i,row] of [s.headers,...s.rows].entries()){const tr=el('tr');row.forEach(v=>tr.append(el(i===0?'th':'td','',v)));n.append(tr)}return n}
 n=el('div','node '+s.kind+(s.kind==='row'&&s.children[0]?.title==='词条目录'?' catalog':''));if(s.kind==='card')n.append(txt(s.title,'h2'));s.children.forEach(c=>n.append(render(c)));return n}
function viewport(s,mobile){const root=el('div','viewport '+(mobile?'mobile ':'')+(s.wide?'wide ':'')+(s.dialog?'dialog ':'')+(s.id.startsWith('login')?'login':''));root.dataset.screen=s.id;root.dataset.mobile=String(mobile);root.append(el('div','brand','LANGUAGE LEAN'+(s.wide?' · 后台管理':'')));if(!s.id.startsWith('login'))root.append(render({kind:'actions',children:[{kind:'button',text:'学习首页',tone:'quiet',target:'home'},{kind:'button',text:s.wide?'查看用户词典':'我的单词本',tone:'quiet',target:s.wide?'dictionary-list':'wordbooks'}]}));if(s.dialog){const modal=el('div','modal');modal.append(txt(s.name,'h2'));s.children.forEach(c=>modal.append(render(c)));root.append(modal)}else{if(s.heading&&s.id!=='dictionary-list')root.append(txt(s.heading,s.wide?'title':'hero'));if(s.wide&&s.route==='/admin')root.append(render({kind:'actions',children:data.tabs.map(([text,target])=>({kind:'button',text,tone:target===s.activeAdminTab?'primary':'secondary',target}))}));s.children.forEach(c=>root.append(render(c)))}return root}
function show(id){const list=id?data.screens.filter(s=>s.id===id):data.screens;const gallery=document.querySelector('.gallery');gallery.replaceChildren();for(const s of list){const wrap=el('section');wrap.id=s.id;wrap.append(el('div','label',s.group+' / '+s.name+' · '+(s.implemented?'已有实现':'第一版待开发')));const pair=el('div','screen-pair');pair.append(viewport(s,false),viewport(s,true));wrap.append(pair);gallery.append(wrap)}document.querySelector('#select').value=id||''}
const select=document.querySelector('#select');data.screens.forEach(s=>{const o=el('option','',s.group+' / '+s.name);o.value=s.id;select.append(o)});select.onchange=()=>{location.hash=select.value};window.onhashchange=()=>show(location.hash.slice(1));show(location.hash.slice(1));window.designData=data;window.showScreen=show;
</script></html>
